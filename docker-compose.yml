services:
  app:
    build: .
    ports:
      - "${WAFER_PORT:-18424}:8000"
    environment:
      WAFER_DB: /data/review.sqlite3
    volumes:
      - wafer_records:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 5s
volumes:
  wafer_records:
